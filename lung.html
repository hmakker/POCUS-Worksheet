<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>POCUS LUNG</title>
<style>
  :root {
    --border: #222;
    --light: #f2f2f2;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 12px;
    background: #ffffff;
    color: #000;
  }

  .page {
    max-width: 820px;
    margin: 0 auto;
  }

  h1 {
    text-align: center;
    font-size: 24px;
    margin: 0 0 10px 0;
  }

  .top-row {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 12px;
  font-size: 14px;
}

  .field {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 3px;
}

  .field input[type="text"] {
  width: 100%;
  border: 1px solid var(--border);
  height: 32px;
  font-size: 15px;
  padding: 4px 6px;
  box-sizing: border-box;
}

  .section-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  flex-wrap: wrap;
  background: var(--light);
  border: 1px solid var(--border);
  border-bottom: none;
  padding: 5px 8px;
  font-weight: bold;
  font-size: 22px;
  margin-top: 8px;
  margin-bottom: 0;
}

  .quality {
    font-weight: normal;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  
.quality-row {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: nowrap;
  gap: 18px;
  padding: 8px 8px;
  margin: 0;
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  background: var(--light);
}

  .quality-row .quality {
  font-size: 13px;
}
  
  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: 13px;
  }

  td {
    border: 1px solid var(--border);
    padding: 4px 6px;
    vertical-align: middle;
  }

  td.label {
    width: 27%;
    font-weight: 600;
  }

  td.options {
  width: 73%;
  white-space: normal;
}

  label.option {
  display: inline-flex;
  align-items: center;
  margin-right: 10px;
  margin-bottom: 6px;
  white-space: nowrap;
  gap: 5px;
}

  input[type="checkbox"] {
  width: 20px;
  height: 20px;
  vertical-align: middle;
  accent-color: #111;
  flex-shrink: 0;
}

  .airway-grid {
    border: 1px solid var(--border);
    padding: 6px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 7px 14px;
    font-size: 13px;
  }

  .airway-grid label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    border-bottom: 1px dotted #aaa;
    padding-bottom: 2px;
  }

  .impression {
    margin-top: 8px;
  }

  .impression-title {
    font-weight: bold;
    font-size: 15px;
    margin-bottom: 4px;
  }

  textarea {
    width: 100%;
    height: 88px;
    border: 1px solid var(--border);
    font-size: 14px;
    padding: 6px;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
  }

  .buttons {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }

  .small-input {
    width: 72px;
    height: 26px;
    font-size: 14px;
    padding: 2px 4px;
    border: 1px solid var(--border);
  }

  .calc-result {
    display: inline-block;
    min-width: 90px;
    padding: 4px 6px;
    border: 1px solid var(--border);
    background: #fff;
    font-weight: bold;
  }

  button {
    font-size: 15px;
    padding: 8px 10px;
    border: 1px solid #222;
    background: #f5f5f5;
    border-radius: 6px;
  }

  @media print {
    body { padding: 0.25in; }
    .page { max-width: none; }
    .buttons { display: none; }
    input[type="checkbox"] { width: 14px; height: 14px; }
    td { padding: 3px 5px; }
    .section-header { margin-top: 5px; padding: 4px 7px; }
    textarea { height: 72px; }
  }

 @media (max-width: 600px) {
  body { padding: 8px; }
  h1 { font-size: 22px; }

  .top-row {
    grid-template-columns: 1fr 1fr;
  }

  .section-header {
    flex-wrap: wrap;
    gap: 8px;
  }

  table {
    font-size: 12px;
  }

  td {
    display: block;
    width: 100% !important;
    box-sizing: border-box;
  }

  td.label {
    background: #f7f7f7;
    font-weight: bold;
  }

  td.options {
    white-space: normal !important;
  }

  label.option {
  display: inline-flex;
  align-items: center;
  vertical-align: middle;
  margin-right: 10px;
  margin-bottom: 6px;
  white-space: nowrap;
  gap: 5px;
}

  .airway-grid {
    grid-template-columns: 1fr 1fr;
  }
}
</style>
</head>

<body>
<div class="page">
  <h1>POCUS LUNG</h1>

  <div class="top-row">
    <div class="field"><span>Date:</span><input type="text" /></div>
    <div class="field"><span>MRN #:</span><input type="text" /></div>
  </div>


  <div class="section-header">
  <span>LUNG</span>
</div>

<div class="quality-row">
  <label class="quality"><input type="checkbox" onchange="updateImpression()" /> Anterior</label>
  <label class="quality"><input type="checkbox" onchange="updateImpression()" /> Lateral</label>
</div>
  <table>
   <tr>
  <td class="label">Lung Sliding</td>
  <td class="options">
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-normal="bilateral lung sliding present" /> Bilateral</label>
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-finding="absent right lung sliding" /> Absent Right</label>
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-finding="absent left lung sliding" /> Absent Left</label>
  </td>
</tr>
    <tr>
  <td class="label">Pneumothorax</td>
  <td class="options">
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-normal="no pneumothorax" /> None</label>
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-finding="suspected pneumothorax" /> Suspected</label>
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-finding="lung point identified" /> Lung Point Identified</label>
  </td>
</tr>
    <tr>
  <td class="label">A-lines</td>
  <td class="options">
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-normal="A-lines present" /> Present</label>
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-finding="A-lines absent" /> Absent</label>
  </td>
</tr>
    <tr>
  <td class="label">B-lines</td>
  <td class="options">
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-normal="no B-lines" /> None</label>
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-finding="focal B-lines" /> Focal</label>
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-finding="diffuse B-lines" /> Diffuse</label>
  </td>
</tr>
    <tr>
  <td class="label">Consolidation</td>
  <td class="options">
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-normal="no lung consolidation" /> No</label>
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-finding="right lung consolidation" /> Right</label>
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-finding="left lung consolidation" /> Left</label>
  </td>
</tr>
   <tr>
  <td class="label">Air Bronchograms</td>
  <td class="options">
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-normal="no air bronchograms" /> Absent</label>
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-finding="air bronchograms present" /> Present</label>
  </td>
</tr>
    <tr>
  <td class="label">Pleural Effusion</td>
  <td class="options">
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-normal="no pleural effusion" /> Absent</label>
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-finding="pleural effusion present" /> Present</label>
  </td>
</tr>
  </table>


  <div class="impression">
    <div class="impression-title">Overall Impression:</div>
    <textarea id="impression"></textarea>
  </div>

  <div class="buttons">
    <button type="button" onclick="copyImpression()">Copy Impression</button>
    <button type="button" onclick="window.print()">Print / Save PDF</button>
    <button type="button" onclick="clearForm()">Clear</button>
  </div>
</div>

<script>
  function updateImpression() {
  var impression = document.getElementById("impression");

  var sections = {
    cardiac: [],
    lung: [],
    fast: [],
    gastric: [],
    airway: []
  };

  var currentSection = "";
  var boxes = document.querySelectorAll("input[data-finding], input[data-normal]");

  for (var i = 0; i < boxes.length; i++) {
    if (boxes[i].checked) {
      var sectionHeader = boxes[i].closest("table, .airway-grid");
      var sectionName = "";

      if (sectionHeader) {
        var previous = sectionHeader.previousElementSibling;

        while (previous) {
          if (previous.classList && previous.classList.contains("section-header")) {
            sectionName = previous.innerText.trim().toLowerCase();
            break;
          }
          previous = previous.previousElementSibling;
        }
      }

      if (sectionName.indexOf("cardiac") !== -1) {
        sections.cardiac.push(boxes[i].getAttribute("data-finding") || boxes[i].getAttribute("data-normal"));
      } else if (sectionName.indexOf("lung") !== -1) {
        sections.lung.push(boxes[i].getAttribute("data-finding") || boxes[i].getAttribute("data-normal"));
      } else if (sectionName.indexOf("fast") !== -1) {
        sections.fast.push(boxes[i].getAttribute("data-finding") || boxes[i].getAttribute("data-normal"));
      } else if (sectionName.indexOf("gastric") !== -1) {
        sections.gastric.push(boxes[i].getAttribute("data-finding") || boxes[i].getAttribute("data-normal"));
      } else if (sectionName.indexOf("airway") !== -1) {
        sections.airway.push(boxes[i].getAttribute("data-finding"));
      }
    }
  }

  var rapEl = document.getElementById("estimatedRAP");
  if (rapEl && rapEl.getAttribute("data-finding")) {
    sections.cardiac.push(rapEl.getAttribute("data-finding"));
  }

  var aorticDetails = document.getElementById("aorticPathologyDetails");
  if (aorticDetails && aorticDetails.value.trim() !== "") {
    sections.cardiac.push("aortic pathology: " + aorticDetails.value.trim());
  }
    
var tapse = document.getElementById("tapseValue");
if (tapse && tapse.value !== "") {
  var val = parseFloat(tapse.value);

  if (!isNaN(val)) {
    if (val < 17) {
      sections.cardiac.push("TAPSE " + val + " mm (reduced RV systolic function)");
    } else {
      sections.cardiac.push("TAPSE " + val + " mm");
    }
  }
}
  var riskEl = document.getElementById("gastricRisk");
  if (riskEl && riskEl.getAttribute("data-risk") === "high") {
    sections.gastric.push("high aspiration risk");
  }

  var output = [];

  if (sections.cardiac.length > 0) {
    output.push("Cardiac: " + sections.cardiac.join("; ") + ".");
  }

  if (sections.lung.length > 0) {
    output.push("Lung: " + sections.lung.join("; ") + ".");
  }

  if (sections.fast.length > 0) {
    output.push("FAST: " + sections.fast.join("; ") + ".");
  }

  if (sections.gastric.length > 0) {
    output.push("Gastric: " + sections.gastric.join("; ") + ".");
  }

  if (sections.airway.length > 0) {
    output.push("Airway: " + sections.airway.join("; ") + ".");
  }

  impression.value = output.join("\n");
}

  function calculateGastric() {
    var age = parseFloat(document.getElementById("gastricAge").value);
    var kg = parseFloat(document.getElementById("gastricKg").value);
    var csa = parseFloat(document.getElementById("gastricCSA").value);

    var volumeEl = document.getElementById("gastricVolume");
    var volumeKgEl = document.getElementById("gastricVolumeKg");
    var riskEl = document.getElementById("gastricRisk");
    var solidEl = document.getElementById("solidGastricContent");
    var solidChecked = solidEl && solidEl.checked;

    if (isNaN(age) || isNaN(kg) || isNaN(csa) || kg <= 0) {
      volumeEl.textContent = "-- mL";
      volumeKgEl.textContent = "-- mL/kg";

      if (solidChecked) {
        riskEl.textContent = "Risk: High";
        riskEl.setAttribute("data-risk", "high");
      } else {
        riskEl.textContent = "Risk: --";
        riskEl.removeAttribute("data-risk");
      }

      updateImpression();
      return;
    }

    var volume = 27.0 + (14.6 * csa) - (1.28 * age);
    if (volume < 0) volume = 0;

    var mlkg = volume / kg;

    volumeEl.textContent = volume.toFixed(1) + " mL";
    volumeKgEl.textContent = mlkg.toFixed(2) + " mL/kg";

    if (solidChecked || mlkg > 1.5) {
      riskEl.textContent = "Risk: High";
      riskEl.setAttribute("data-risk", "high");
    } else {
      riskEl.textContent = "Risk: Low";
      riskEl.setAttribute("data-risk", "low");
    }

    updateImpression();
  }

  function copyImpression() {
    updateImpression();
    var impression = document.getElementById("impression");
    impression.focus();
    impression.select();

    try {
      navigator.clipboard.writeText(impression.value);
    } catch (e) {
      document.execCommand("copy");
    }
  }

  function clearForm() {
    var inputs = document.querySelectorAll("input");
    for (var i = 0; i < inputs.length; i++) {
      if (inputs[i].type === "checkbox") {
        inputs[i].checked = false;
      } else {
        inputs[i].value = "";
      }
    }
    document.getElementById("impression").value = "";
    if (document.getElementById("gastricVolume")) {
      document.getElementById("gastricVolume").textContent = "-- mL";
      document.getElementById("gastricVolumeKg").textContent = "-- mL/kg";
      document.getElementById("gastricRisk").textContent = "Risk: --";
      document.getElementById("gastricRisk").removeAttribute("data-risk");
    }
  }

  window.onload = function() {
    var boxes = document.querySelectorAll("input[type='checkbox']");
    for (var i = 0; i < boxes.length; i++) {
      boxes[i].addEventListener("change", function() { updateImpression(); calculateGastric(); });
      boxes[i].addEventListener("click", function() { updateImpression(); calculateGastric(); });
    }
    calculateGastric();
    updateImpression();
  };
  function calculateRAP() {
  var ivcLarge = document.querySelector('input[data-ivc-size="large"]');
  var collapseHigh = document.querySelector('input[data-ivc-collapse="high"]');
  var collapseLow = document.querySelector('input[data-ivc-collapse="low"]');
  var rapEl = document.getElementById("estimatedRAP");

  if (!ivcLarge || !collapseHigh || !collapseLow || !rapEl) return;

  if (ivcLarge.checked && collapseLow.checked) {
  rapEl.textContent = "RAP: 15 mmHg";
  rapEl.setAttribute("data-finding", "estimated right atrial pressure 15 mmHg");
} else if (ivcLarge.checked && collapseHigh.checked) {
  rapEl.textContent = "RAP: 8 mmHg";
  rapEl.setAttribute("data-finding", "estimated right atrial pressure 8 mmHg");
} else if (!ivcLarge.checked && collapseHigh.checked) {
  rapEl.textContent = "RAP: 3 mmHg";
  rapEl.setAttribute("data-finding", "estimated right atrial pressure 3 mmHg");
} else {
  rapEl.textContent = "RAP: --";
  rapEl.removeAttribute("data-finding");
}

updateImpression();
}
</script>

</body>
</html>
