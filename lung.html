<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>POCUS LUNG</title>
<style>
  :root {
    --border: #222;
    --light: #f2f2f2;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 12px;
    background: #ffffff;
    color: #000;
  }

  .page {
    max-width: 820px;
    margin: 0 auto;
  }

  h1 {
    text-align: center;
    font-size: 24px;
    margin: 0 0 10px 0;
  }

  .top-row {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 12px;
  font-size: 14px;
}

  .field {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 3px;
}

  .field input[type="text"] {
  width: 100%;
  border: 1px solid var(--border);
  height: 32px;
  font-size: 15px;
  padding: 4px 6px;
  box-sizing: border-box;
}

  .section-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  flex-wrap: wrap;
  background: var(--light);
  border: 1px solid var(--border);
  border-bottom: none;
  padding: 5px 8px;
  font-weight: bold;
  font-size: 22px;
  margin-top: 8px;
  margin-bottom: 0;
}

  .quality {
    font-weight: normal;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  
.quality-row {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: nowrap;
  gap: 18px;
  padding: 8px 8px;
  margin: 0;
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  background: var(--light);
}

  .quality-row .quality {
  font-size: 13px;
}
  
  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: 13px;
  }

  td {
    border: 1px solid var(--border);
    padding: 4px 6px;
    vertical-align: middle;
  }

  td.label {
    width: 27%;
    font-weight: 600;
  }

  td.options {
  width: 73%;
  white-space: normal;
}

  label.option {
  display: inline-flex;
  align-items: center;
  margin-right: 10px;
  margin-bottom: 6px;
  white-space: nowrap;
  gap: 5px;
}

  input[type="checkbox"] {
  width: 20px;
  height: 20px;
  vertical-align: middle;
  accent-color: #111;
  flex-shrink: 0;
}

  .airway-grid {
    border: 1px solid var(--border);
    padding: 6px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 7px 14px;
    font-size: 13px;
  }

  .airway-grid label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    border-bottom: 1px dotted #aaa;
    padding-bottom: 2px;
  }

  .impression {
    margin-top: 8px;
  }

  .impression-title {
    font-weight: bold;
    font-size: 15px;
    margin-bottom: 4px;
  }

  textarea {
    width: 100%;
    height: 88px;
    border: 1px solid var(--border);
    font-size: 14px;
    padding: 6px;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
  }

  .buttons {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }

  .small-input {
    width: 72px;
    height: 26px;
    font-size: 14px;
    padding: 2px 4px;
    border: 1px solid var(--border);
  }

  .calc-result {
    display: inline-block;
    min-width: 90px;
    padding: 4px 6px;
    border: 1px solid var(--border);
    background: #fff;
    font-weight: bold;
  }

  button {
    font-size: 15px;
    padding: 8px 10px;
    border: 1px solid #222;
    background: #f5f5f5;
    border-radius: 6px;
  }

  @media print {
    body { padding: 0.25in; }
    .page { max-width: none; }
    .buttons { display: none; }
    input[type="checkbox"] { width: 14px; height: 14px; }
    td { padding: 3px 5px; }
    .section-header { margin-top: 5px; padding: 4px 7px; }
    textarea { height: 72px; }
  }

 @media (max-width: 600px) {
  body { padding: 8px; }
  h1 { font-size: 22px; }

  .top-row {
    grid-template-columns: 1fr 1fr;
  }

  .section-header {
    flex-wrap: wrap;
    gap: 8px;
  }

  table {
    font-size: 12px;
  }

  td {
    display: block;
    width: 100% !important;
    box-sizing: border-box;
  }

  td.label {
    background: #f7f7f7;
    font-weight: bold;
  }

  td.options {
    white-space: normal !important;
  }

  label.option {
  display: inline-flex;
  align-items: center;
  vertical-align: middle;
  margin-right: 10px;
  margin-bottom: 6px;
  white-space: nowrap;
  gap: 5px;
}

  .airway-grid {
    grid-template-columns: 1fr 1fr;
  }
}
</style>
</head>

<body>
<div class="page">
  <h1>POCUS LUNG</h1>

  <div class="top-row">
    <div class="field"><span>Date:</span><input type="text" /></div>
    <div class="field"><span>MRN #:</span><input type="text" /></div>
  </div>


  <div class="section-header">
  <span>LUNG</span>
</div>

<div class="quality-row">
  <label class="quality"><input type="checkbox" onchange="updateImpression()" /> Anterior</label>
  <label class="quality"><input type="checkbox" onchange="updateImpression()" /> Lateral</label>
</div>
  <table>
   <tr>
  <td class="label">Lung Sliding</td>
  <td class="options">
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-normal="bilateral lung sliding present" /> Bilateral</label>
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-finding="absent right lung sliding" /> Absent Right</label>
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-finding="absent left lung sliding" /> Absent Left</label>
  </td>
</tr>
    <tr>
  <td class="label">Pneumothorax</td>
  <td class="options">
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-normal="no pneumothorax" /> None</label>
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-finding="right pneumothorax" /> Right</label>
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-finding="left pneumothorax" /> Left</label>
    <label class="option">
  <input type="checkbox" id="lungPointCheckbox" onchange="updateImpression()" /> Lung Point
</label>
<input type="text" id="lungPointLocation" class="small-input" placeholder="location" oninput="updateImpression()" />
  </td>
</tr>
    <tr>
  <td class="label">A-lines</td>
  <td class="options">
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-normal="A-lines present bilaterally" /> Bilateral</label>
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-finding="A-lines absent on right" /> Absent Right</label>
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-finding="A-lines absent on left" /> Absent Left</label>
  </td>
</tr>
    <tr>
  <td class="label">B-lines</td>
  <td class="options">
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-normal="no B-lines" /> None</label>
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-finding="focal B-lines on right" /> Focal Right</label>
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-finding="focal B-lines on left" /> Focal Left</label>
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-finding="diffuse B-lines on right" /> Diffuse Right</label>
  <label class="option"><input type="checkbox" onchange="updateImpression()" data-finding="diffuse B-lines on left" /> Diffuse Left</label>
  </td>
</tr>
    <tr>
  <td class="label">Consolidation</td>
  <td class="options">
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-normal="no lung consolidation" /> None</label>
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-finding="right lung consolidation" /> Right</label>
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-finding="left lung consolidation" /> Left</label>
  </td>
</tr>
</tr>
   <tr>
  <td class="label">Air Bronchograms</td>
  <td class="options">
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-normal="no air bronchograms" /> None</label>
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-finding="air bronchograms on right" /> Right</label>
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-finding="air bronchograms on left" /> Left</label>
  </td>
</tr>
    <tr>
  <td class="label">Pleural Effusion</td>
  <td class="options">
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-normal="no pleural effusion" /> None</label>
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-finding="right pleural effusion" /> Right</label>
    <label class="option"><input type="checkbox" onchange="updateImpression()" data-finding="left pleural effusion" /> Left</label>
  </td>
</tr>
  </table>


  <div class="impression">
    <div class="impression-title">Overall Impression:</div>
    <textarea id="impression"></textarea>
  </div>

  <div class="buttons">
    <button type="button" onclick="copyImpression()">Copy Impression</button>
    <button type="button" onclick="window.print()">Print / Save PDF</button>
    <button type="button" onclick="clearForm()">Clear</button>
  </div>
</div>

<script>
  function updateImpression() {
    var impression = document.getElementById("impression");
    var findings = [];

    var boxes = document.querySelectorAll("input[data-finding], input[data-normal]");

    for (var i = 0; i < boxes.length; i++) {
      if (boxes[i].checked) {
        findings.push(boxes[i].getAttribute("data-finding") || boxes[i].getAttribute("data-normal"));
      }
    }
var lungPointBox = document.getElementById("lungPointLocation");
var lungPointChecked = document.getElementById("lungPointCheckbox");

if (lungPointChecked && lungPointChecked.checked && lungPointBox && lungPointBox.value.trim() !== "") {
  findings.push("lung point at " + lungPointBox.value.trim());
}
    if (findings.length > 0) {
      impression.value = "Lung: " + findings.join("; ") + ".";
    } else {
      impression.value = "";
    }
  }

  function copyImpression() {
    updateImpression();
    var impression = document.getElementById("impression");
    impression.focus();
    impression.select();

    try {
      navigator.clipboard.writeText(impression.value);
    } catch (e) {
      document.execCommand("copy");
    }
  }

  function clearForm() {
    var inputs = document.querySelectorAll("input");
    for (var i = 0; i < inputs.length; i++) {
      if (inputs[i].type === "checkbox") {
        inputs[i].checked = false;
      } else {
        inputs[i].value = "";
      }
    }
    document.getElementById("impression").value = "";
  }

  window.onload = function() {
    var boxes = document.querySelectorAll("input[type='checkbox']");
    for (var i = 0; i < boxes.length; i++) {
      boxes[i].addEventListener("change", updateImpression);
      boxes[i].addEventListener("click", updateImpression);
    }
    updateImpression();
  };

</script>

</body>
</html>
